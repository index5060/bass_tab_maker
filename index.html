<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bass Practice</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      file:// 안내판.

      브라우저는 file:// 출처(origin "null")에서 ES 모듈을 불러오는 것을 CORS로 막습니다.
      그래서 이 파일을 그냥 더블클릭하면 아래 module 스크립트가 통째로 차단되고 화면이
      하얗게 남습니다. 인라인 classic 스크립트는 차단되지 않으므로, 여기서 상황을 감지해
      빈 화면 대신 뭘 해야 하는지 띄웁니다.
    -->
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('root').innerHTML = [
          '<div style="max-width:640px;margin:12vh auto;padding:0 24px;',
          'font:15px/1.7 ui-sans-serif,system-ui,-apple-system,\'Apple SD Gothic Neo\',sans-serif;',
          'color:#e6e9ef">',
          '<h1 style="font-size:20px;margin:0 0 4px">이 파일은 직접 열 수 없습니다</h1>',
          '<p style="color:#8b94a5;margin:0 0 24px">',
          '브라우저가 <code>file://</code>에서 ES 모듈 로딩을 차단하기 때문입니다. ',
          '웹앱이라 서버로 띄워야 합니다.</p>',
          '<p style="margin:0 0 8px">터미널에서 프로젝트 폴더로 간 뒤:</p>',
          '<pre style="background:#161a21;border:1px solid #2a303b;border-radius:10px;',
          'padding:14px 16px;overflow-x:auto;margin:0 0 20px"><code>npm install\nnpm run dev</code></pre>',
          '<p style="margin:0 0 24px">그리고 터미널에 찍히는 ',
          '<strong style="color:#f0a04b">http://localhost:5173</strong> 주소를 브라우저에서 여세요.</p>',
          '<p style="color:#8b94a5;font-size:13px;margin:0">',
          '빌드된 버전을 보고 싶으면 <code>npm start</code> (빌드 후 서버 실행).</p>',
          '</div>',
        ].join('');
        document.body.style.background = '#0f1115';
        document.body.style.margin = '0';
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
